[package]
name = "ac-signalr-client"
version = "0.1.0"
edition = "2021"
authors = ["SDGM"]
description = "A Rust library for calling SignalR hubs using fastwebsockets"
license = "MIT"
repository = "https://github.com/Acelerar/ac-signalr-client-lib-rs"
homepage = "https://github.com/Acelerar/ac-signalr-client-lib-rs"
documentation = "https://docs.rs/ac-signalr-client"
readme = "README.md"
keywords = ["signalr", "rust", "websockets", "tokio"]
categories = ["network-programming", "web-programming", "asynchronous"]

[dependencies]
tracing = "0.1.44"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
futures = "0.3.32"
base64 = "0.22.1"
tokio = { version = "1.52.3", features = ["full"] }
fastwebsockets = { version = "0.10.0", features = ["unstable-split", "upgrade"] }
http = "1.4.0"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full", "tokio"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
rmp = "0.8.15"
rmp-serde = "1.3.1"
rustls = "0.23.40"
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.3"

[dev-dependencies]
test-log = { version = "0.2.20", features = ["log"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = "0.4.44"
